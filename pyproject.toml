[project]
name = "aang-airbender"
version = "0.1.0"
description = "Camera-based hand gesture control for macOS"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "jsonschema==4.26.0",
    "mediapipe==0.10.21",
    "opencv-python==4.11.0.86",
    "pyobjc-framework-applicationservices==12.2.1",
    "pyobjc-framework-quartz==12.2.1",
    "pyyaml==6.0.3",
]

[project.scripts]
aang-airbender = "aang_airbender.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]
